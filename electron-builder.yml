appId: com.staticscodes.openclone
productName: Open Clone
copyright: Copyright © 2026 statiiiix. MIT licensed.
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - LICENSE
# The voice engine: a private Python for this Mac's chip, and the helper script it runs.
extraResources:
  - from: build/python-${arch}
    to: python
    filter:
      - "**/*"
      - "!.built-*"
  - from: python/engine.py
    to: engine/engine.py
npmRebuild: false
mac:
  category: public.app-category.music
  target: dmg
  minimumSystemVersion: "12.0"
  artifactName: Open-Clone-${version}-${arch}.${ext}
  icon: build/icon.icns
  # "-" = ad-hoc signature (required for Apple Silicon to launch at all).
  # Replace with a Developer ID and add notarization before selling.
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    NSMicrophoneUsageDescription: Open Clone records your voice to create a voice clone. Recordings stay on this Mac.
dmg:
  title: Open Clone ${version}
